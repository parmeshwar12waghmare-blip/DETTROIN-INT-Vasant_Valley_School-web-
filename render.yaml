# render.yaml — Render deployment configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API Server ──────────────────────────────────────────────────────
  - type: web
    name: vasant-valley-school-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false          # Set this manually in the Render dashboard
      - key: PORT
        value: 10000         # Render's default internal port
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        sync: false          # Set to your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false          # Optional: Instagram Graph API token
      - key: INSTAGRAM_USER_ID
        sync: false          # Optional: Instagram user ID
    healthCheckPath: /api/health
    autoDeploy: true
